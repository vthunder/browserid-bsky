# Build pds-bridge in CI and deploy the image to dokku.
# Pattern: build on Actions (persistent gha layer cache), push to GHCR,
# then `dokku git:from-image` so the host never compiles Rust.
#
# One-time setup (see docs/plans/2026-07-24-bsky-bridge-deploy-plan.md):
# - repo secret  DOKKU_SSH_KEY : private key authorized for the dokku user
# - repo variable DOKKU_HOST   : the dokku host (e.g. apps.sandmill.org)
# - after the first push: make the ghcr.io package public so dokku can
#   pull it without credentials.

name: deploy-bridge

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vthunder/browserid-bsky/pds-bridge

jobs:
  build-and-deploy:
    # Only the canonical repo deploys/publishes; the public staging mirror
    # (vthunder/browserid-bsky-staging) runs release-candidate.yml only.
    if: github.repository == 'vthunder/browserid-bsky'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to dokku
        if: ${{ vars.DOKKU_HOST != '' }}
        env:
          DOKKU_SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
          DOKKU_HOST: ${{ vars.DOKKU_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DOKKU_SSH_KEY" > ~/.ssh/dokku_key
          chmod 600 ~/.ssh/dokku_key
          # The dokku user's forced command turns the args into a dokku
          # command; git:from-image pulls the image and releases it.
          # `git:from-image` exits 1 on an unchanged image digest — a re-run of an
          # already-released sha is a no-op, not a failure.
          out=$(ssh -i ~/.ssh/dokku_key -o StrictHostKeyChecking=accept-new \
            "dokku@$DOKKU_HOST" git:from-image bsky-bridge "$IMAGE:$GITHUB_SHA" 2>&1) \
            || { echo "$out" | grep -q "No changes detected" \
                 && echo "no-op: image digest unchanged (already deployed)" \
                 || { echo "$out" | tail -30; exit 1; }; }
          echo "$out" | tail -5
