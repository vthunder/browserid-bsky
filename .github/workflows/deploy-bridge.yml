# Build pds-bridge in CI and deploy the image to dokku.
# Pattern: build on Actions (persistent gha layer cache), push to GHCR,
# then `dokku git:from-image` so the host never compiles Rust.
#
# One-time setup (see docs/plans/2026-07-24-bsky-bridge-deploy-plan.md):
# - repo secret  DOKKU_SSH_KEY : private key authorized for the dokku user
# - repo variable DOKKU_HOST   : the dokku host (e.g. apps.sandmill.org)
# - after the first push: make the ghcr.io package public so dokku can
#   pull it without credentials.

name: deploy-bridge

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vthunder/browserid-bsky/pds-bridge

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to dokku
        if: ${{ vars.DOKKU_HOST != '' }}
        env:
          DOKKU_SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
          DOKKU_HOST: ${{ vars.DOKKU_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DOKKU_SSH_KEY" > ~/.ssh/dokku_key
          chmod 600 ~/.ssh/dokku_key
          # The dokku user's forced command turns the args into a dokku
          # command; git:from-image pulls the image and releases it.
          ssh -i ~/.ssh/dokku_key -o StrictHostKeyChecking=accept-new \
            "dokku@$DOKKU_HOST" git:from-image bsky-bridge "$IMAGE:$GITHUB_SHA"
