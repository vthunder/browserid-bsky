[package]
name = "pds-bridge"
description = "Bluesky bridge: browserid-provisioned atproto accounts + warrant-scoped agent access via a stock PDS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
browserid-core = { workspace = true }
browserid-rp = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sha2.workspace = true
k256 = "0.14.0"
# ES256 for the atproto OAuth confidential client: private_key_jwt client
# assertions and per-flow DPoP proofs.
p256 = { version = "0.14.0", features = ["ecdsa"] }
serde_ipld_dagcbor = "0.6.4"
serde_bytes = "0.11"
bs58 = "0.5.1"

[dev-dependencies]
axum-test = "16"
