[workspace]
resolver = "2"
members = [
    "pds-bridge",
    "smoke",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/vthunder/browserid-bsky"

[workspace.dependencies]
# browserid-ng protocol crates (git; Cargo.lock pins the rev — bump with
# `cargo update -p browserid-core -p browserid-rp`)
browserid-core = { git = "https://github.com/vthunder/browserid-ng", branch = "main" }
browserid-rp = { git = "https://github.com/vthunder/browserid-ng", branch = "main" }
browserid-agent = { git = "https://github.com/vthunder/browserid-ng", branch = "main" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
